<template>
    <!-- ═══════════════════════ HEADER & METRICS ═══════════════════════ -->
    <lightning-card title="Helpdesk — Ticket Manager" icon-name="standard:service_report">

        <!-- Dashboard Metrics -->
        <div class="slds-grid slds-gutters slds-p-around_medium metrics-bar">
            <div class="slds-col slds-size_1-of-4">
                <div class="metric-card">
                    <span class="metric-value">{metricTotal}</span>
                    <span class="metric-label">Total</span>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-4">
                <div class="metric-card metric-open">
                    <span class="metric-value">{metricOpen}</span>
                    <span class="metric-label">Open</span>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-4">
                <div class="metric-card metric-resolved">
                    <span class="metric-value">{metricResolved}</span>
                    <span class="metric-label">Resolved</span>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-4">
                <div class="metric-card metric-violated">
                    <span class="metric-value">{metricViolated}</span>
                    <span class="metric-label">SLA Violated</span>
                </div>
            </div>
        </div>

        <!-- ═══════════════════════ FILTERS ═══════════════════════ -->
        <div class="slds-grid slds-gutters slds-p-horizontal_medium slds-p-bottom_small filter-bar">
            <div class="slds-col slds-size_1-of-3">
                <lightning-input
                    type="search"
                    label="Search Tickets"
                    placeholder="Search by title…"
                    value={searchTerm}
                    onchange={handleSearchChange}>
                </lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-3">
                <lightning-combobox
                    label="Status"
                    placeholder="All Statuses"
                    options={statusOptions}
                    value={filterStatus}
                    onchange={handleStatusFilter}>
                </lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-3">
                <lightning-combobox
                    label="Priority"
                    placeholder="All Priorities"
                    options={priorityOptions}
                    value={filterPriority}
                    onchange={handlePriorityFilter}>
                </lightning-combobox>
            </div>
        </div>

        <!-- ═══════════════════════ LOADING SPINNER ═══════════════════════ -->
        <template if:true={isLoading}>
            <div class="slds-align_absolute-center slds-p-around_large">
                <lightning-spinner alternative-text="Loading tickets…" size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- ═══════════════════════ EMPTY STATE ═══════════════════════ -->
        <template if:true={isEmpty}>
            <div class="slds-align_absolute-center slds-p-around_xx-large empty-state">
                <lightning-icon icon-name="utility:info" size="large" class="slds-m-right_small"></lightning-icon>
                <div>
                    <p class="slds-text-heading_small">No tickets found</p>
                    <p class="slds-text-body_regular slds-text-color_weak">Try adjusting your filters or create a new ticket.</p>
                </div>
            </div>
        </template>

        <!-- ═══════════════════════ KANBAN / CARD GRID ═══════════════════════ -->
        <template if:true={hasTickets}>
            <div class="slds-grid slds-wrap slds-gutters slds-p-around_medium">
                <template for:each={tickets} for:item="ticket">
                    <div key={ticket.Id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-p-bottom_small">
                        <article class={ticket.cardClass}>
                            <!-- Card Header -->
                            <div class="slds-card__header slds-grid">
                                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                    <div class="slds-media__body">
                                        <h2 class="slds-card__header-title slds-truncate" title={ticket.Title__c}>
                                            <span class="slds-text-heading_small">{ticket.Name}</span>
                                        </h2>
                                        <p class="slds-truncate slds-text-body_small" title={ticket.Title__c}>{ticket.Title__c}</p>
                                    </div>
                                </header>
                                <!-- SLA Alert Icon -->
                                <template if:true={ticket.SLA_Violated__c}>
                                    <lightning-icon
                                        icon-name="utility:warning"
                                        variant="error"
                                        size="small"
                                        alternative-text="SLA Violated"
                                        title="SLA Violated!">
                                    </lightning-icon>
                                </template>
                                <template if:true={ticket.isSlaAtRisk}>
                                    <lightning-icon
                                        icon-name="utility:clock"
                                        variant="warning"
                                        size="small"
                                        alternative-text="SLA At Risk"
                                        title="SLA At Risk — less than 2 hours remaining">
                                    </lightning-icon>
                                </template>
                            </div>

                            <!-- Card Body -->
                            <div class="slds-card__body slds-card__body_inner">
                                <div class="slds-grid slds-gutters_x-small slds-m-bottom_x-small">
                                    <span class={ticket.priorityBadgeClass}>{ticket.Priority__c}</span>
                                    <span class={ticket.statusBadgeClass}>{ticket.Status__c}</span>
                                </div>
                                <p class="slds-text-body_small slds-m-top_xx-small">
                                    <lightning-icon icon-name="utility:clock" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                    SLA: <lightning-formatted-date-time value={ticket.SLA_Deadline__c} year="numeric" month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                                </p>
                                <template if:true={ticket.Assigned_Agent__r}>
                                    <p class="slds-text-body_small slds-m-top_xx-small">
                                        <lightning-icon icon-name="utility:user" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                        {ticket.Assigned_Agent__r.Name}
                                    </p>
                                </template>
                            </div>

                            <!-- Card Footer — Quick Status Change -->
                            <footer class="slds-card__footer">
                                <lightning-combobox
                                    label="Change Status"
                                    variant="label-hidden"
                                    placeholder="Change status…"
                                    options={allStatusOptions}
                                    value={ticket.Status__c}
                                    data-ticket-id={ticket.Id}
                                    onchange={handleQuickStatusChange}>
                                </lightning-combobox>
                            </footer>
                        </article>
                    </div>
                </template>
            </div>
        </template>

    </lightning-card>
</template>
